<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center h-screen m-0">

    <h1 class="text-3xl font-bold mb-4"> Memory-Card</h1>
    <p class="text-slate-400 mb-6"></p>

    <div id="game-board" class="grid grid-cols-4 gap-4 w-80">
        
    </div>

    <script>
        const emojis = ['🍎', '🚀', '🐱', '⚽', '🚗', '⭐'];
        let cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
        let flippedCards = [];
        let matchedPairs = 0;
        let isLocked = false;

        const board = document.getElementById('game-board');

        function createBoard() {
            board.innerHTML = '';
            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.className = "h-20 bg-indigo-900 rounded-xl flex items-center justify-center text-3xl cursor-pointer hover:bg-indigo-800 transition select-none shadow-md";
                card.innerText = "❓";
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (isLocked) return;
            const card = this;
            
            if (card.classList.contains('bg-white') || flippedCards.includes(card)) return;

            card.innerText = card.dataset.emoji;
            card.className = "h-20 bg-white text-slate-900 rounded-xl flex items-center justify-center text-3xl cursor-pointer transition select-none shadow-md font-bold";
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.emoji === card2.dataset.emoji) {
                flippedCards = [];
                matchedPairs++;
                if (matchedPairs === emojis.length) {
                    setTimeout(() => alert('🎉 Та яллаа! Бүх хосыг оллоо.'), 300);
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    card1.innerText = "❓";
                    card1.className = "h-20 bg-indigo-900 rounded-xl flex items-center justify-center text-3xl cursor-pointer hover:bg-indigo-800 transition select-none shadow-md";
                    
                    card2.innerText = "❓";
                    card2.className = "h-20 bg-indigo-900 rounded-xl flex items-center justify-center text-3xl cursor-pointer hover:bg-indigo-800 transition select-none shadow-md";
                    
                    flippedCards = [];
                    isLocked = false;
                }, 1000);
            }
        }

        createBoard();
    </script>
</body>
</html>
